name: Jekyll

# Trigger workflow on push to gh-pages branch or manual run
on:
  push:
    branches: ["gh-pages"]
  workflow_dispatch:

# Set permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from overlapping
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest  # Use macOS runner (supports both x64 and ARM)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby environment
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'    # Specify Ruby version to install
          bundler-cache: true      # Cache gems installed by bundler for faster builds

      - name: Configure GitHub Pages environment
        uses: actions/configure-pages@v5
        id: pages

      - name: Build the Jekyll site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production  # Set environment to production for optimized build

      - name: Upload site artifact for deployment
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: macos-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment


